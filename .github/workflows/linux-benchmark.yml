name: Linux benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S v3 -B v3/build-linux
          -DCMAKE_BUILD_TYPE=Release
          -DKAMA_MEMORY_POOL_BUILD_TESTS=ON
          -DKAMA_MEMORY_POOL_BUILD_EXAMPLES=OFF
          -DKAMA_MEMORY_POOL_ENABLE_STATS=OFF
          -DKAMA_MEMORY_POOL_ENABLE_DEBUG_GUARDS=OFF
      - name: Build
        run: cmake --build v3/build-linux --parallel
      - name: Unit tests
        run: ctest --test-dir v3/build-linux --output-on-failure -R kama_unit_test
      - name: Performance benchmark
        run: ./v3/build-linux/perf_test | tee v3/build-linux/linux-performance.txt
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: linux-performance-${{ github.sha }}
          path: v3/build-linux/linux-performance.txt
